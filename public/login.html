<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    .custom-card {
      width: 400px; /* Kartı dikdörtgen yapmak için genişlik ekledik */
      min-height: 500px;
    }
    .register-card {
      width: 400px; /* Altındaki kartın genişliği de uyumlu olsun */
      margin-top: 20px;
      padding: 10px;
      text-align: center;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
  </style>
    <link rel="icon" href="../public/assets/pageImages/logo.png" type="image/x-icon">

</head>

<body>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <nav class="navbar navbar-expand-lg" style="background-color: #4a2040;">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center text-white" href="../public/index.php">
        <img src="../public/assets/pageImages/logo.png" alt="Logo" width="60" height="60">
        <span class="ms-2">Ayse's Pink Recipe Book</span>
      </a>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <!-- Login Card -->
      <div class="col-md-4">
        <div class="card custom-card">
          <div class="card-body">
            <h5 class="card-title text-center; mt-4;">Login</h5>
            <form id="loginForm">
              <div class="mb-3 mt-5">
                <label for="logUser" class="form-label">Username</label>
                <input type="text" class="form-control" id="logUser" placeholder="Enter your username" required>
              </div>
              <div class="mb-4">
                <label for="logPass" class="form-label">Password</label>
                <input type="password" class="form-control" id="logPass" placeholder="Enter your password" required>
              </div>
              <button type="submit" class="btn w-100" style="background-color: #4a2040; color: white;">Login</button>
              <!-- "You don't have an account?" moved below the button -->
              <p class="mt-4 text-center" style="color: #4a2040;">You don't have an account? <a href="../public/register.html" style="color: #4a2040;">Register</a></p>
            </form>
            <!-- Success message moved to the bottom -->
            <div id="loginMessage" class="mt-4 text-center"></div>
          </div>
        </div>
      </div>
      <!-- Carousel -->
      <div class="col-md-8 d-flex align-items-center">
        <div class="carousel-container" style="width: 100%;">
          <div id="carouselExampleDark" class="carousel carousel-dark slide">
            <div class="carousel-indicators">
              <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
              <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1" aria-label="Slide 2"></button>
            </div>
            <div class="carousel-inner">
              <div class="carousel-item active" data-bs-interval="2000">
                <img src="../public/assets/pageImages/login-photo1.png" alt="..." class="img-fluid" style="width: 100%;">
              </div>
              <div class="carousel-item" data-bs-interval="2000">
                <img src="../public/assets/pageImages/login-photo2.png" alt="..." class="img-fluid" style="width: 100%;">
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Satır 107'yi değiştir -->
<script>
document.getElementById('loginForm').addEventListener('submit', async function(event) {
  event.preventDefault();

  const username = document.getElementById('logUser').value;
  const password = document.getElementById('logPass').value;

  try {
    // ✅ DÜZELT: API path
    const response = await fetch('../api/auth/login.php', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ logUser: username, logPass: password }),
    });

    const data = await response.json();

   if (data.success) {
    document.getElementById('loginMessage').innerText = 'Login successful!';
    setTimeout(() => {
        window.location.href = '../public/account.php'; // ✅ Account sayfasına yönlendir
    }, 1000);
} else {
      document.getElementById('loginMessage').innerText = data.message;
    }
  } catch (error) {
    document.getElementById('loginMessage').innerText = 'Connection error!';
  }
});
</script>
</body>
</html>
