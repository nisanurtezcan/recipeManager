<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    .custom-card {
      min-height: 500px;
      height: auto;
    }

    .full-container {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .carousel-container {
      width: 60%;
    }

    .card-container {
      width: 35%;
    }

    @media (max-width: 768px) {
      .full-container {
        flex-direction: column;
        align-items: center;
      }

      .carousel-container,
      .card-container {
        width: 100%;
      }
    }
  </style>
    <link rel="icon" href="../public/assets/pageImages/logo.png" type="image/x-icon">
  </head>

<body>

  <nav class="navbar navbar-expand-lg" style="background-color: #4a2040;">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center text-white" href="../public/index.php">
        <img src="../public/assets/pageImages/logo.png" alt="Logo" width="60" height="60">
        <span class="ms-2">Ayse's Pink Recipe Book</span>
      </a>
    </div>
  </nav>

  <div class="container full-container mt-5">
    <div class="row justify-content-center align-items-center">
      <!-- Register Card -->
      <div class="col-md-6">
        <div class="card custom-card p-4">
          <h3 class="text-center mb-4">Register</h3>
          <form id="registerForm">
            <div class="mb-3">
              <label for="regUser" class="form-label">Username</label>
              <input type="text" class="form-control" id="regUser" name="regUser" placeholder="Enter your username" required>
            </div>
            <div class="mb-3">
              <label for="regEmail" class="form-label">Email</label>
              <input type="email" class="form-control" id="regEmail" name="regEmail" placeholder="Enter your email" required>
            </div>
            <div class="mb-3">
              <label for="regPass" class="form-label">Password</label>
              <input type="password" class="form-control" id="regPass" name="regPass" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn w-100" style="background-color: #4a2040; color: white;">Register</button>
            <div class="text-center mt-3">
<p class="mt-4 text-center" style="color: #4a2040;">Already have an account? <a href="login.html" style="color: #4a2040;">Login</a></p>            </div>
          </form>
        </div>
      </div>
  
      <!-- Single Image -->
      <div class="col-md-6 d-flex align-items-center">
        <div class="image-container" style="width: 100%;">
          <img src="../public/assets/pageImages/register-photo.png" alt="Kadayif Image" class="img-fluid" style="width: 100%; height: auto; object-fit: cover;">
        </div>
      </div>
    </div>
  </div>
  
  

<a href="login.html">Already have an account? Login.</a>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(event) {
  event.preventDefault();

  const username = document.getElementById('regUser').value;
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPass').value;

  try {
    const response = await fetch('../api/auth/register.php', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ regUser: username, regEmail: email, regPass: password }),
    });

    const data = await response.json();

    if (data.success) {
      alert('Registration successful!');
      window.location.href = 'login.html';
    } else {
      alert('Registration failed: ' + data.message);
    }
  } catch (error) {
    alert('Error: ' + error.message);
  }
});
</script>

</body>

</html>
